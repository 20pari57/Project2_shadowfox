<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <!-- Orbit ring gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BAF2" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Tooth inner gradient -->
    <linearGradient id="toothInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Subtle tooth shine -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Orbit (back part of the ring) -->
  <path 
    d="M 50,92 C 55,62 100,45 160,55 C 195,62 215,75 210,88 C 206,97 185,102 155,103" 
    fill="none" 
    stroke="url(#orbitGrad)" 
    stroke-width="12" 
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Main Tooth Shape (Outer Outline + Fill) -->
  <g id="tooth-body">
    <!-- Tooth Base & Roots Path -->
    <path 
      d="M 85,25 
         C 105,27 115,36 120,38 
         C 125,36 135,27 155,25 
         C 185,22 205,42 200,82 
         C 196,115 186,140 178,175 
         C 174,195 160,205 148,202 
         C 138,200 135,185 133,165 
         C 131,148 127,125 120,125 
         C 113,125 109,148 107,165 
         C 105,185 102,200 92,202 
         C 80,205 66,195 62,175 
         C 54,140 44,115 40,82 
         C 35,42 55,22 85,25 Z" 
      fill="url(#toothInner)" 
      stroke="#1E3A8A" 
      stroke-width="13" 
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner soft highlight -->
    <path 
      d="M 86,37 
         C 103,39 113,46 120,48 
         C 127,46 137,39 154,37 
         C 178,35 188,52 185,82 
         C 182,106 174,128 168,155
         C 165,140 162,100 156,80
         C 150,60 135,50 115,50
         C 95,50 82,60 76,82
         C 70,105 66,138 64,155
         C 58,128 50,106 47,82
         C 44,52 54,35 86,37 Z" 
      fill="url(#shineGrad)" 
    />
  </g>

  <!-- Foreground Orbit (front part of the ring looping across the tooth) -->
  <path 
    d="M 38,118 
       C 35,108 55,95 90,85 
       C 130,73 175,72 205,82 
       C 220,87 225,95 220,104 
       C 212,118 178,135 135,145 
       C 90,155 52,150 42,138 
       C 38,133 36,125 38,118 Z" 
    fill="url(#orbitGrad)" 
  />

  <!-- Subtle glow line in the front orbit -->
  <path 
    d="M 52,122 C 85,110 145,100 198,102" 
    fill="none" 
    stroke="#E0F2FE" 
    stroke-width="3.5" 
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- "DENTAL CARE" Text underneath -->
  <text 
    x="120" 
    y="242" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="22" 
    font-weight="800" 
    letter-spacing="2" 
    fill="#0284C7"
  >DENTAL CARE</text>
</svg>
